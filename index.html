<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1f2a28;--mute:#66736f;--line:#dfe5e2;--pri:#2f6f6a;--pri2:#e3f0ee;--warn:#b4531f;--warn2:#fbeadf;--ok:#2d7a3e;--ok2:#e2f3e6;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141a19;--card:#1e2624;--ink:#e8eeec;--mute:#93a29e;--line:#33403d;--pri:#5fb3aa;--pri2:#20332f;--warn:#f0a070;--warn2:#3a2a20;--ok:#7fd08f;--ok2:#1f3324;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{position:sticky;top:0;background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:14px}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}

button.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
button.b.sec{background:var(--pri2);color:var(--pri)}
button.b.red{background:var(--bad)}
button.b:disabled{opacity:.5}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--pri2);color:var(--pri);font-size:13px;margin:2px 4px 2px 0}
.tag.warn{background:var(--warn2);color:var(--warn)}

.list-item{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}

.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);margin-right:8px;animation:bl 1s infinite}

.qa.bad{border-color:var(--warn)}
.score{font-size:40px;font-weight:700;color:var(--pri)}
ul{padding-left:20px;margin:6px 0}
.loading{padding:20px;text-align:center;color:var(--mute)}
pre{white-space:pre-wrap;font:inherit;margin:0}
.notice{background:var(--warn2);color:var(--warn);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
.chart{width:100%;height:auto;display:block}

.rp{background:#fff;color:#1f2a28;border:1px solid var(--line);border-radius:12px;padding:28px 24px;max-width:720px;margin:0 auto 14px}
.rp h2{font-size:22px;margin:0 0 4px;color:#2f6f6a}

<body>
<header><button id="backBtn" data-act="back" style="display:none">← 뒤로</button><h1 id="title">부모 상담 도우미</h1><button data-act="settings">설정</button></header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
/* ============ 저장소 (IndexedDB, 이 기기 안에만 저장) ============ */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    if (db) return res(db);
    const r = indexedDB.open('parent-coach', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('children', { keyPath: 'id' });
      d.createObjectStore('sessions', { keyPath: 'id' });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    all: (s) => tx(s, 'readonly', (o) => o.getAll()),
    get: (s, id) => tx(s, 'readonly', (o) => o.get(id)),
    put: (s, v) => tx(s, 'readwrite', (o) => o.put(v)),
    del: (s, id) => tx(s, 'readwrite', (o) => o.delete(id)),
  };
})();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = (s) => esc(s).replace(/\n/g, '<br>');
const today = () => new Date().toISOString().slice(0, 10);
const cfg = {
  get key() { try { return localStorage.getItem('pc_key') || ''; } catch { return ''; } },
  set key(v) { try { localStorage.setItem('pc_key', v); } catch {} },
  get model() { try { return localStorage.getItem('pc_model') || 'claude-sonnet-4-5'; } catch { return 'claude-sonnet-4-5'; } },
  set model(v) { try { localStorage.setItem('pc_model', v); } catch {} },
  get center() { try { return localStorage.getItem('pc_center') || ''; } catch { return ''; } },
  set center(v) { try { localStorage.setItem('pc_center', v); } catch {} },
  get therapist() { try { return localStorage.getItem('pc_th') || ''; } catch { return ''; } },
  set therapist(v) { try { localStorage.setItem('pc_th', v); } catch {} },
  get mode() { try { return localStorage.getItem('pc_mode') || 'auto'; } catch { return 'auto'; } },
  set mode(v) { try { localStorage.setItem('pc_mode', v); } catch {} },
  get maskWords() { try { return localStorage.getItem('pc_mask') || ''; } catch { return ''; } },
  set maskWords(v) { try { localStorage.setItem('pc_mask', v); } catch {} },
  get anon() { try { return localStorage.getItem('pc_anon') !== '0'; } catch { return true; } },
  set anon(v) { try { localStorage.setItem('pc_anon', v ? '1' : '0'); } catch {} },
};

/* ============ AI 호출 ============ */
/* ---------- 치료사 프로필 → AI 안내문 ---------- */
const PROF_DEF = { job: '작업치료사', years: '', clients: '', style: 'coach', extra: '' };
function getProf() { try { return { ...PROF_DEF, ...JSON.parse(localStorage.getItem('pc_prof') || '{}') }; } catch { return { ...PROF_DEF }; } }
function setProf(p) { try { localStorage.setItem('pc_prof', JSON.stringify(p)); } catch {} }
function systemPrompt() {
  const p = getProf();
  const who = (p.job || '치료사') + (p.years ? '(경력 ' + p.years + '년)' : '');
  let t = `당신은 아동 발달·재활 분야 치료사의 '부모 상담' 도우미입니다. 사용자는 ${who}이고, ${p.clients ? '주로 ' + p.clients + '을(를) 만나며, ' : ''}한국 부모를 대상으로 수업 후 짧은 상담을 합니다.
목표: 부모가 치료사에게 신뢰를 느끼고 치료를 지속하도록, 전문성과 따뜻함을 갖춘 상담을 돕는 것.
원칙:
- 결론(아이의 오늘 변화)을 먼저, 근거(관찰한 구체적 장면)를 다음, 가정에서 할 일 1~2개, 다음 목표 순서로 말하기.
- 전문용어는 쉬운 말로 풀어 쓰고, 필요하면 용어를 한 번만 덧붙이기.
- 아이의 강점을 먼저 말하되 과장/허위 약속(완치, 기간 보장)은 하지 않기. 부족한 점은 '다음 목표'로 프레이밍하기.
- 진단이나 의학적 판단을 단정하지 말고 필요 시 의사/타 전문가 연계를 안내.
- 답변은 한국어, 실제로 말할 수 있는 구어체 문장으로.`;
  t += p.style === 'expert'
    ? '\n도움 방식: 사용자는 경력이 많은 전문가입니다. 기본기 설명이나 훈계조 조언은 생략하고 핵심만 간결하게 제시하세요. 코칭은 놓친 신호, 표현 다듬기, 부모별 맞춤 접근 위주로 하고, 근거 없는 칭찬은 하지 마세요.'
    : '\n도움 방식: 사용자는 상담 스킬을 키우는 중입니다. 잘한 점과 개선할 점을 실제 대화 표현과 함께 구체적으로 알려 주세요.';
  if (p.extra) t += '\n사용자의 추가 지침: ' + p.extra;
  return t;
}

/* ---------- 개인정보 자동 가리기 (밖으로 나가는 글에만 적용, 기기 안 원본은 그대로) ---------- */
const escRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const splitWords = (x) => String(x || '').split(/[,\n，、]/).map((w) => w.trim()).filter(Boolean);
const isKo3 = (n) => /^[가-힣]{3}$/.test(n || '');
function wordRules(ctx) {
  const rules = [];
  const add = (w, r, k) => { if (w && w.length >= 2) rules.push([w, r, k]); };
  ctx.children.forEach((c) => {
    const kid = !ctx.currentId || c.id === ctx.currentId ? '아이' : '다른 아이';
    add(c.name, kid, '아이 이름'); if (isKo3(c.name)) add(c.name.slice(1), kid, '아이 이름');
    splitWords(c.parentNames).forEach((p) => { add(p, '부모님', '보호자 이름'); if (isKo3(p)) add(p.slice(1), '부모님', '보호자 이름'); });
    splitWords(c.maskWords).forEach((w) => add(w, '[가림]', '지정 단어'));
  });
  splitWords(cfg.maskWords).forEach((w) => add(w, '[가림]', '지정 단어'));
  add(cfg.center, '[센터]', '센터명');
  add(cfg.therapist, '[치료사]', '치료사 이름'); if (isKo3(cfg.therapist)) add(cfg.therapist.slice(1), '[치료사]', '치료사 이름');
  return rules.sort((a, b) => b[0].length - a[0].length);
}
const PATTERNS = [
  ['주민번호', /(?<!\d)\d{6}[-\s]?[1-4]\d{6}(?!\d)/g, '[주민번호]'],
  ['전화번호', /(?<!\d)0(?:1[016-9]|2|[3-6][1-5]|70|50\d?)[-.\s]?\d{3,4}[-.\s]?\d{4}(?!\d)/g, '[전화번호]'],
  ['카드번호', /(?<!\d)(?:\d{4}[-\s]?){3}\d{4}(?!\d)/g, '[카드번호]'],
  ['이메일', /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[이메일]'],
  ['주소', /[가-힣0-9]{2,}(?:아파트|빌라|맨션|오피스텔)(?:\s?\d+동)?(?:\s?\d+호)?/g, '[주소]'],
  ['주소', /[가-힣]{2,}(?<!으)(?:대로|로|길)\s?\d+(?:-\d+)?(?:번길(?:\s?\d+(?:-\d+)?)?)?(?![~\d]|\s?(?:번(?!길)|개|회|분|초|명|살|세|시|달|주|일|년|월|배|점|장|곡|문장|문|줄|가지|cm|mm|kg|%))/g, '[주소]'],
  ['긴 숫자', /(?<!\d)\d[\d-]{8,}\d(?!\d)/g, '[번호]'],
];
function redact(text, ctx) {
  let t = String(text); const found = {}; const bump = (k) => (found[k] = (found[k] || 0) + 1);
  wordRules(ctx).forEach(([w, r, k]) => { const isName = k === '아이 이름' || k === '보호자 이름' || k === '치료사 이름'; t = t.replace(new RegExp(escRe(w) + (isName ? '(?:이(?=[가는를도랑의만에께한]|[\\s.,!?]|$))?' : ''), 'g'), () => { bump(k); return r; }); });
  PATTERNS.forEach(([k, re, r]) => { t = t.replace(re, (m) => { if (k === '긴 숫자' && m.replace(/\D/g, '').length < 10) return m; bump(k); return r; }); });
  return { text: t, found };
}
async function redactText(text) {
  if (!cfg.anon) return { text: String(text), found: {} };
  return redact(text, { children: await DB.all('children'), currentId: S.childId });
}
const foundSummary = (f) => Object.entries(f).map(([k, v]) => k + ' ' + v + '건').join(', ') || '가려진 항목 없음';

/* ---------- 복사·붙여넣기 모드 (API 키 없이 무료 AI 채팅 이용) ---------- */
function pasteFlow(prompt, found, sys) {
  return new Promise((res, rej) => {
    const full = '아래 [역할과 원칙]을 따라 [요청]에 답해 주세요.\n\n[역할과 원칙]\n' + sys + '\n\n[요청]\n' + prompt;
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mbox">
      <h3 style="margin:0 0 4px">AI에게 물어보기 (무료 방식)</h3>
      <div class="mute">개인정보는 아래처럼 자동으로 가려졌어요. 그래도 남은 실명이 있으면 글에서 직접 지워 주세요.</div>
      <div id="m_sum" style="margin-top:6px"></div>
      <h4>① 아래 글을 복사해서 AI 채팅창에 붙여넣기</h4>
      <textarea id="m_prompt"></textarea>
      <div class="row" style="margin-top:8px"><button class="b" id="m_copy">복사하기</button>
        <a class="b sec" href="https://claude.ai/new" target="_blank" rel="noopener">Claude 열기</a>
        <a class="b sec" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기</a>
        <a class="b sec" href="https://gemini.google.com/app" target="_blank" rel="noopener">Gemini 열기</a></div>
      <h4>② AI가 답한 내용을 전부 복사해서 여기에 붙여넣기</h4>
      <textarea id="m_ans" placeholder="AI의 답변 전체를 붙여넣으세요"></textarea>
      <div class="row" style="margin-top:10px"><button class="b" id="m_ok">결과 적용</button><button class="b sec" id="m_no">취소</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector('#m_prompt').value = full;
    m.querySelector('#m_sum').innerHTML = (Object.keys(found).length ? Object.entries(found).map(([k, v]) => `<span class="chip">${esc(k)} ${v}건 가림</span>`).join('') : '<span class="mute">자동으로 가려진 항목이 없어요.</span>');
    const close = () => m.remove();
    m.querySelector('#m_copy').onclick = async (e) => {
      const ta = m.querySelector('#m_prompt');
      try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); }
      e.target.textContent = '복사됨 ✓';
    };
    m.querySelector('#m_ok').onclick = () => { const v = m.querySelector('#m_ans').value.trim(); if (!v) return; close(); res(v); };
    m.querySelector('#m_no').onclick = () => { close(); rej(new Error('취소했어요.')); };
  });
}

async function callAI(userText, maxTokens = 2500) {
  const r = await redactText(userText);
  const sysText = (await redactText(systemPrompt())).text;
  if (cfg.mode === 'paste' || !cfg.key) return pasteFlow(r.text, r.found, sysText);
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': cfg.key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({ model: cfg.model, max_tokens: maxTokens, system: sysText, messages: [{ role: 'user', content: r.text }] }),
  });
  const j = await resp.json();
  if (!resp.ok) throw new Error(j.error?.message || 'AI 호출 실패 (' + resp.status + ')');
  return j.content.map((c) => c.text || '').join('');
}
function parseJSON(t) {
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('AI 응답을 해석하지 못했습니다. 다시 시도해 주세요.');
  return JSON.parse(t.slice(a, b + 1));
}
const anonText = (s, child) => {
  if (!cfg.anon || !child || !child.name) return s;
  return String(s).split(child.name).join('아이');
};
const childCtx = (c) => `[아이 정보] 나이/학년: ${c.age || '미입력'} / 진단·주호소: ${c.dx || '미입력'} / 치료 목표: ${c.goals || '미입력'} / 부모 성향·특이사항: ${c.parentNote || '미입력'} / 등록 후 수업 횟수: ${c.sessionsCount || '미입력'}${goalCtx(c)}`;

/* ============ 질문/답변 유형 ============ */
const QTYPES = ['효과·성과 확인', '기간·횟수·종결 시기', '가정 지도 방법', '발달 불안·진단 관련', '행동 문제 대처', '학교·또래 적응', '비용·스케줄', '타 치료·타 기관 비교', '불만·불신 표현', '기타'];
const ATYPES = ['공감형', '근거·관찰 제시형', '구체적 가이드형', '모호·회피형', '전문용어 과다형', '과잉 약속형', '방어·변명형'];

/* ============ 상태/렌더 ============ */
let S = { view: 'home', childId: null, sessionId: null, tab: 'home', busy: false, msg: '', rec: null };
const $app = document.getElementById('app');
let navDepth = 0, popping = false;
const snap = () => ({ view: S.view, childId: S.childId, sessionId: S.sessionId, tab: S.tab });
function updateBack() { const b = document.getElementById('backBtn'); if (b) b.style.display = navDepth > 0 ? '' : 'none'; }
try { history.replaceState({ pc: 1, d: 0, S: snap() }, ''); } catch {}
const go = (v, extra = {}) => {
  const doGo = () => {
    const before = JSON.stringify(snap());
    S = { ...S, view: v, msg: '', ...extra };
    if (JSON.stringify(snap()) !== before) { navDepth++; try { history.pushState({ pc: 1, d: navDepth, S: snap() }, ''); } catch {} }
    render(); window.scrollTo(0, 0); updateBack();
  };
  if (REC.on && v !== 'record') return recStopUI().catch(() => {}).then(doGo);   // 녹음 중 다른 화면으로 가면 자동 저장
  doGo();
};
window.addEventListener('popstate', async (e) => {
  const st = e.state; if (!st || !st.pc) return;
  if (REC.on) { try { await recStopUI(); } catch {} }
  navDepth = st.d; S = { ...S, ...st.S, msg: '' }; render(); window.scrollTo(0, 0); updateBack();
});

function setNav() {
  const tabs = [['home', '아이 목록'], ['stats', '데이터 분석'], ['coach', '즉석 코치'], ['backup', '백업']];
  document.getElementById('nav').innerHTML = tabs.map(([k, n]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${n}</button>`).join('');
}

async function render() {
  setNav();
  const v = S.view;
  try {
    if (v === 'home') return home();
    if (v === 'child') return child();
    if (v === 'childForm') return childForm();
    if (v === 'prep') return prep();
    if (v === 'record') return record();
    if (v === 'review') return review();
    if (v === 'report') return report();
    if (v === 'stats') return stats();
    if (v === 'coach') return coach();
    if (v === 'backup') return backup();
    if (v === 'settings') return settings();
  } catch (e) { $app.innerHTML = `<div class="card">오류: ${esc(e.message)}</div>`; }
}

/* ---------- 목표별 진행 기록 ---------- */
let sessQ = Promise.resolve();
const updateSession = (id, fn) => (sessQ = sessQ.then(async () => { const x = await DB.get('sessions', id); if (!x) return; await fn(x); await DB.put('sessions', x); }).catch(() => {}));
const LEVELS = ['', '전적 도움', '많은 도움', '일부 도움', '거의 독립', '독립'];
const goalVal = (g, v) => (v == null || v === '' ? '-' : g.mode === 'pct' ? v + '%' : v + '단계(' + LEVELS[v] + ')');
const goalCtx = (c) => ((c.goalItems || []).length ? ' / 목표 항목: ' + c.goalItems.map((g) => g.title + (g.mode === 'pct' ? '(정반응률)' : '(도움 수준 1~5)')).join(', ') : '');
function goalSummary(c, s) {
  const L = s.goalLogs || {};
  const rows = (c.goalItems || []).filter((g) => L[g.id] && L[g.id].v != null).map((g) => g.title + ': ' + goalVal(g, L[g.id].v) + (L[g.id].note ? ' (' + L[g.id].note + ')' : ''));
  return rows.length ? '\n[오늘 목표별 기록] ' + rows.join(' / ') : '';
}
function goalRowHtml(g) {
  return `<div class="goal-row row" data-gid="${esc(g.id)}" style="margin-bottom:6px"><input class="gr-t grow" placeholder="예: 1~10 수 세기" value="${esc(g.title)}" style="min-width:160px"><select class="gr-m" style="width:auto"><option value="level" ${g.mode !== 'pct' ? 'selected' : ''}>도움 수준(1~5)</option><option value="pct" ${g.mode === 'pct' ? 'selected' : ''}>정반응률(%)</option></select><button type="button" class="b red" data-act="delGoalRow">삭제</button></div>`;
}
function goalLogCard(c, s) {
  const gs = c.goalItems || [];
  if (!gs.length) return `<div class="card"><h3>오늘 목표별 기록</h3><div class="mute">아이 정보 수정에서 '목표 항목'을 추가하면 수업마다 진행을 기록하고 그래프로 볼 수 있어요.</div></div>`;
  const L = s.goalLogs || {};
  return `<div class="card"><h3>오늘 목표별 기록</h3><div class="mute">1 전적 도움 · 2 많은 도움 · 3 일부 도움 · 4 거의 독립 · 5 독립 (정반응률 항목은 0~100 숫자를 적어요). 누르면 바로 저장돼요. 같은 번호를 다시 누르면 취소돼요.</div>`
    + gs.map((g) => {
      const v = L[g.id]?.v;
      const input = g.mode === 'pct'
        ? `<input class="gl-pct" type="number" min="0" max="100" style="width:110px" value="${v ?? ''}" placeholder="0~100"> %`
        : [1, 2, 3, 4, 5].map((n) => `<button type="button" class="b ${v === n ? '' : 'sec'} gl-lv" data-act="setLevel" data-v="${n}">${n}</button>`).join('');
      return `<div style="margin-top:12px" data-goal="${esc(g.id)}"><b>${esc(g.title)}</b><div class="row" style="margin-top:4px">${input}<input class="gl-note grow" style="min-width:160px" placeholder="메모 (예: 6~7에서 헷갈림)" value="${esc(L[g.id]?.note || '')}"></div></div>`;
    }).join('') + `</div>`;
}
function goalProgressCard(c, sess) {
  const gs = c.goalItems || [];
  if (!gs.length) return '';
  const sorted = [...sess].sort((a, b) => a.date.localeCompare(b.date));
  const blocks = gs.map((g) => {
    const pts = sorted.filter((x) => x.goalLogs?.[g.id]?.v != null).map((x) => ({ l: x.date.slice(5), v: Number(x.goalLogs[g.id].v) })).slice(-10);
    if (!pts.length) return `<div style="margin-top:12px"><b>${esc(g.title)}</b> <span class="mute">아직 기록이 없어요</span></div>`;
    const cur = pts[pts.length - 1].v, d = cur - pts[0].v;
    const head = `<b>${esc(g.title)}</b> <span class="tag ${d > 0 ? 'ok' : d < 0 ? 'warn' : ''}">현재 ${esc(goalVal(g, cur))}${pts.length > 1 ? (d > 0 ? ' · ▲' + d : d < 0 ? ' · ▼' + Math.abs(d) : ' · 변화 없음') + ' (처음 대비)' : ''}</span>`;
    return `<div style="margin-top:14px">${head}${pts.length > 1 ? lineChart(pts, g.mode === 'pct' ? 100 : 5, g.mode === 'pct' ? '%' : '') : ''}</div>`;
  }).join('');
  return `<div class="card"><h3>목표별 진행</h3>${blocks}</div>`;
}
async function goalReportHtml(c, s) {
  const L = s.goalLogs || {};
  const gs = (c.goalItems || []).filter((g) => L[g.id] && L[g.id].v != null);
  if (!gs.length) return '';
  const prevs = (await DB.all('sessions')).filter((x) => x.childId === c.id && x.id !== s.id && x.date <= s.date).sort((a, b) => a.date.localeCompare(b.date));
  const rows = gs.map((g) => {
    const cur = L[g.id].v; let prev = null;
    prevs.forEach((x) => { const pv = x.goalLogs?.[g.id]?.v; if (pv != null) prev = pv; });
    const d = prev == null ? '' : cur > prev ? ' (지난번보다 좋아졌어요)' : cur < prev ? ' (오늘은 조금 더 어려워했어요)' : ' (지난번과 비슷해요)';
    return `<li>${esc(g.title)}: ${esc(goalVal(g, cur))}${d}</li>`;
  });
  return `<h3>목표별 진행</h3><ul>${rows.join('')}</ul>`;
}

const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* ---------- 카카오톡·네이버 등 인앱 브라우저 → 외부 브라우저로 열기 ---------- */
(function () {
  const ua = navigator.userAgent;
  if (!/KAKAOTALK|NAVER\(inapp|Line\/|Instagram|FBAN|FBAV/i.test(ua)) return;
  const url = location.href;
  const isAndroid = /Android/i.test(ua), isKakao = /KAKAOTALK/i.test(ua);
  const chromeUrl = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
  const openExt = () => {
    if (isAndroid) location.href = chromeUrl;

/* ---------- 아이별 성장 그래프 ---------- */
function lineChart(pts, max, unit) {
  const W = 600, H = 170, L = 34, R = 28, T = 14, B = 30;
  const x = (i) => L + (pts.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (pts.length - 1));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const grid = [0, 0.5, 1].map((g) => `<line x1="${L}" x2="${W - R}" y1="${y(max * g)}" y2="${y(max * g)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(max * g) + 4}" text-anchor="end">${+(max * g).toFixed(1)}</text>`).join('');
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(p.v)).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--pri)"/><text x="${x(i)}" y="${y(p.v) - 8}" text-anchor="middle" style="fill:var(--ink)">${p.v}${unit || ''}</text><text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(p.l)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="추이 그래프">${grid}<path d="${path}" fill="none" stroke="var(--pri)" stroke-width="2.5"/>${dots}</svg>`;
}
function growthCard(sess) {
  const a = sess.filter((s) => s.analysis).sort((p, q) => p.date.localeCompare(q.date));
  if (a.length < 2) return `<div class="card"><h3>상담 성장 그래프</h3><div class="mute">AI 분석이 2회 이상 쌓이면 이 아이 상담의 점수 변화가 그래프로 나타나요.</div></div>`;
  const last = a.slice(-8);
  const lab = { empathy: '공감', evidence: '근거 제시', clarity: '쉬운 설명', guidance: '가정 지도', confidence: '자신감·전문성' };
  const first = a[0].analysis.scores || {}, cur = a[a.length - 1].analysis.scores || {};
  const rows = Object.keys(lab).map((k) => { const d = (Number(cur[k]) || 0) - (Number(first[k]) || 0); return `<div class="bar"><div class="n">${lab[k]}</div><div class="t"><i style="width:${(Number(cur[k]) || 0) * 20}%"></i></div><div class="v">${cur[k] ?? '-'}</div><div class="v" style="width:44px;color:${d > 0 ? 'var(--ok)' : d < 0 ? 'var(--warn)' : 'var(--mute)'}">${d > 0 ? '▲' + d : d < 0 ? '▼' + Math.abs(d) : '–'}</div></div>`; }).join('');
  return `<div class="card"><h3>상담 성장 그래프 <span class="mute">(최근 ${last.length}회 신뢰 점수)</span></h3>${lineChart(last.map((s) => ({ l: s.date.slice(5), v: Number(s.analysis.score) || 0 })), 100)}
  <h3 style="margin-top:12px">항목별 최근 점수 <span class="mute">(첫 상담 대비 변화)</span></h3>${rows}</div>`;
}

/* {이름} 치환 + 받침에 맞는 조사 보정 */
function fillName(t, name) {
  const last = name.charCodeAt(name.length - 1), hasB = last >= 0xac00 && last <= 0xd7a3 && (last - 0xac00) % 28 !== 0;
  const map = { '이': ['이', '가'], '가': ['이', '가'], '은': ['은', '는'], '는': ['은', '는'], '을': ['을', '를'], '를': ['을', '를'], '과': ['과', '와'], '와': ['과', '와'] };
  return t.replace(/\{이름\}([이가은는을를과와])?/g, (m, j) => name + (j ? map[j][hasB ? 0 : 1] : ''));
}

  <div class="card"><h3>질문 유형별 내 답변 평점 (낮은 순)</h3>${weak.map(([k, v, n]) => `<div class="bar"><div class="n">${esc(k)}</div><div class="t"><i style="width:${v * 20}%"></i></div><div class="v">${v}</div></div>`).join('')}</div>

  <div class="card"><h3>이탈 위험 '높음' 최근 상담</h3>${risky.map((s) => `<div class="list-item" data-act="openSession" data-id="${s.id}"><b>${esc(kids[s.childId]?.name || '?')}</b> ${esc(s.date)}<div class="mute">${esc(s.analysis.dropout_reason)}</div></div>`).join('') || '<div class="mute">없음</div>'}</div>`;
}

/* ---------- 즉석 코치 ---------- */
async function coach() {
  document.getElementById('title').textContent = '즉석 코치';
  $app.innerHTML = `<div class="card"><h3>부모님 질문에 어떻게 답하지?</h3>
  <div class="mute">상담 직전/직후에 부모님이 하신 질문을 적으면 바로 답변 예시를 줘요. (내 초안을 같이 적으면 첨삭도 해줘요)</div>
  <label>부모님 질문</label><textarea id="c_q" style="min-height:70px" placeholder="예: 우리 애는 몇 달째 하는데 뭐가 좋아진 건지 모르겠어요."></textarea>
  <label>(선택) 내가 하려던 답변</label><textarea id="c_a" style="min-height:70px"></textarea>
  <div class="row" style="margin-top:10px"><button class="b" data-act="coachGo" ${S.busy ? 'disabled' : ''}>답변 코칭 받기</button></div></div>
  ${S.busy ? '<div class="loading">생각 중...</div>' : ''}${S.msg ? `<div class="notice">${esc(S.msg)}</div>` : ''}
  ${S.coachOut ? `<div class="card"><pre>${esc(S.coachOut)}</pre></div>` : ''}`;
}

/* ---------- 백업 ---------- */
async function backup() {
  document.getElementById('title').textContent = '백업';
  $app.innerHTML = `<div class="card"><h3>데이터 백업/복원</h3>
  <div class="mute">기록은 이 기기에만 저장돼요. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업하세요. (녹음 파일은 용량 때문에 백업에 포함되지 않아요)</div>
  <div class="row" style="margin-top:12px"><button class="b" data-act="export">백업 파일 저장</button>
  <label class="b sec" style="margin:0;cursor:pointer">복원하기<input id="imp" type="file" accept=".json" style="display:none"></label></div>${S.msg ? `<div class="notice" style="margin-top:12px">${esc(S.msg)}</div>` : ''}</div>`;
  document.getElementById('imp').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      for (const c of d.children || []) await DB.put('children', c);
      for (const s of d.sessions || []) { const old = await DB.get('sessions', s.id); if (old?.audio) s.audio = old.audio; await DB.put('sessions', s); }
      S.msg = `복원 완료: 아이 ${(d.children || []).length}명, 상담 ${(d.sessions || []).length}건`;
    } catch { S.msg = '올바른 백업 파일이 아니에요.'; }
    render();
  };
}

/* ---------- 설정 ---------- */
async function settings() {
  document.getElementById('title').textContent = '설정';
  $app.innerHTML = `<div class="card"><h3>AI 연결</h3>
  <div class="mute">Anthropic API 키는 이 기기의 브라우저에만 저장되고, AI 분석을 요청할 때만 Anthropic 서버로 전송돼요.</div>
  <label>AI 연결 방식</label><select id="s_mode"><option value="auto" ${cfg.mode !== 'paste' ? 'selected' : ''}>자동 (API 키 사용 · 유료)</option><option value="paste" ${cfg.mode === 'paste' ? 'selected' : ''}>복사·붙여넣기 (무료 · 키 불필요)</option></select>
  <div class="mute">키가 없으면 자동으로 복사·붙여넣기 방식이 돼요.</div>
  <label>API 키</label><input id="s_key" type="password" value="${esc(cfg.key)}" placeholder="sk-ant-...">
  <label>모델</label><input id="s_model" value="${esc(cfg.model)}">
  <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="s_anon" style="width:auto" ${cfg.anon ? 'checked' : ''}> AI로 보낼 때 개인정보 자동 가리기 (권장)</label>
  <div class="mute" style="margin-top:8px">가려지는 것: 등록한 아이·보호자 이름, 전화번호, 주민번호, 이메일, 카드·계좌 번호, 주소 일부, 센터명·치료사 이름, 직접 지정한 단어. 이름은 <b>등록해 둔 것만</b> 찾을 수 있어요. 기록 원본은 이 기기에 그대로 남고, 밖으로 나가는 글만 가려져요. 완벽하지 않으니 복사 전에 꼭 훑어보세요.</div>
  <label>모든 아이에게 공통으로 가릴 단어 (쉼표로 구분)</label><input id="s_mask" value="${esc(cfg.maskWords)}" placeholder="예: OO아동발달센터, △△초등학교">
  <label>가리기 테스트</label><textarea id="s_test" style="min-height:70px" placeholder="예: 민준이 어머니 010-1234-5678로 연락 주세요"></textarea>
  <div class="row" style="margin-top:6px"><button class="b sec" data-act="testMask">가려진 모습 보기</button></div>
  <div id="s_sum" class="mute" style="margin-top:6px"></div><pre id="s_out" style="margin-top:4px"></pre>
  <h3 style="margin-top:20px">치료사 프로필</h3>
  <div class="mute">AI가 내 상황에 맞게 답하도록 알려 주세요.</div>
  <label>직무</label><input id="s_job" value="${esc(getProf().job)}" placeholder="예: 인지치료사, 작업치료사">
  <label>경력(년)</label><input id="s_years" type="number" min="0" value="${esc(getProf().years)}">
  <label>주로 만나는 아이</label><input id="s_clients" value="${esc(getProf().clients)}" placeholder="예: 지적장애·발달지연 학령기 아동">
  <label>AI 도움 방식</label><select id="s_style"><option value="coach" ${getProf().style !== 'expert' ? 'selected' : ''}>상담 스킬 코칭 (잘한 점·개선점을 자세히)</option><option value="expert" ${getProf().style === 'expert' ? 'selected' : ''}>경력자용 (간결하게, 놓친 신호·표현 다듬기 중심)</option></select>
  <label>추가 지침 (선택)</label><textarea id="s_extra" style="min-height:70px" placeholder="예: 진단명은 쓰지 말고 쉬운 말로 설명해 주세요">${esc(getProf().extra)}</textarea>
  <div class="row" style="margin-top:12px"><button class="b" data-act="saveSettings">저장</button><button class="b sec" data-act="tab" data-v="home">닫기</button></div></div>
  <div class="card" id="mic_card"><h3>마이크 점검</h3>
  <div class="mute">녹음·받아쓰기가 안 될 때 여기서 상태를 확인하고 허용 요청을 보낼 수 있어요.</div>
  <div id="mic_status" style="margin-top:8px">확인 중…</div>
  <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="b" data-act="micAllow">마이크 허용 요청 / 소리 테스트</button><button class="b sec" data-act="sttTest">받아쓰기 테스트</button><button class="b sec" data-act="micRefresh">상태 새로고침</button></div>
  <div style="height:10px;background:#e4e8e6;border-radius:6px;margin-top:10px;overflow:hidden"><div id="mic_meter" style="height:100%;width:0;background:var(--brand,#2f6f6a)"></div></div>
  <div id="mic_out" class="mute" style="margin-top:6px"></div>
  <div id="mic_help"></div></div>`;
  micRefresh();
}

/* ============ 이벤트 ============ */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  await sessQ;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'tab') return go(el.dataset.v, { tab: el.dataset.v, childId: null });
  if (act === 'back') { if (navDepth > 0) history.back(); else go('home', { tab: 'home', childId: null }); return; }
  if (act === 'settings') return go('settings');
  if (act === 'micCheck') { if (REC.on && !confirm('녹음을 멈추고 설정으로 이동할까요?')) return; if (REC.on) { try { await recStopUI(); } catch {} } return go('settings'); }
  if (act === 'micAllow') return micTest();
  if (act === 'sttTest') return sttTest();
  if (act === 'micRefresh') return micRefresh();
  if (act === 'saveSettings') { cfg.key = document.getElementById('s_key').value.trim(); cfg.model = document.getElementById('s_model').value.trim() || 'claude-sonnet-4-5'; cfg.anon = document.getElementById('s_anon').checked; cfg.mode = document.getElementById('s_mode').value; cfg.maskWords = document.getElementById('s_mask').value.trim(); setProf({ job: f('s_job') || '치료사', years: f('s_years'), clients: f('s_clients'), style: document.getElementById('s_style').value, extra: f('s_extra') }); return go('home', { tab: 'home' }); }
  if (act === 'testMask') { const r = await redactText(document.getElementById('s_test').value); document.getElementById('s_out').textContent = r.text; document.getElementById('s_sum').textContent = foundSummary(r.found); return; }
  if (act === 'addGoalRow') { document.getElementById('goalRows').insertAdjacentHTML('beforeend', goalRowHtml({ id: uid(), title: '', mode: 'level' })); return; }
  if (act === 'delGoalRow') { el.closest('.goal-row').remove(); return; }
  if (act === 'setLevel') {
    const box = el.closest('[data-goal]'); const gid = box.dataset.goal; const n = Number(el.dataset.v); let nv = null;
    await updateSession(S.sessionId, (x) => { x.goalLogs = x.goalLogs || {}; const cur = x.goalLogs[gid] || {}; nv = cur.v === n ? null : n; x.goalLogs[gid] = { ...cur, v: nv }; });
    box.querySelectorAll('.gl-lv').forEach((b) => b.classList.toggle('sec', Number(b.dataset.v) !== nv)); return;
  }
  if (act === 'newChild') return go('childForm', { childId: null });
  if (act === 'editChild') return go('childForm', { childId: id });
  if (act === 'openChild') return go('child', { childId: id, tab: 'home' });
  if (act === 'saveChild') {
    const name = document.getElementById('f_name').value.trim(); if (!name) return alert('이름을 입력해 주세요.');
    const old = id ? await DB.get('children', id) : {};
    const c = { ...old, id: id || uid(), name, age: f('f_age'), dx: f('f_dx'), goals: f('f_goals'), parentNote: f('f_pn'), parentNames: f('f_pnames'), maskWords: f('f_mask'), goalItems: [...document.querySelectorAll('.goal-row')].map((r) => ({ id: r.dataset.gid, title: r.querySelector('.gr-t').value.trim(), mode: r.querySelector('.gr-m').value })).filter((g) => g.title) };
    await DB.put('children', c); return go('child', { childId: c.id });
  }
  if (act === 'delChild') { if (!confirm('이 아이와 모든 상담 기록을 삭제할까요?')) return; for (const s of (await DB.all('sessions')).filter((s) => s.childId === id)) await DB.del('sessions', s.id); await DB.del('children', id); return go('home', { tab: 'home', childId: null }); }
  if (act === 'newSession') { const s = { id: uid(), childId: id, date: today() }; await DB.put('sessions', s); return go('prep', { childId: id, sessionId: s.id }); }
  if (act === 'openSession') { const s = await DB.get('sessions', id); return go('review', { childId: s.childId, sessionId: id }); }
  if (act === 'reprep') { const s = await DB.get('sessions', id); return go('prep', { childId: s.childId, sessionId: id }); }
  if (act === 'reRecord') return go('record');
  if (act === 'openReport') return go('report');
  if (act === 'backReview') return go('review');
  if (act === 'genReport') return genReport();
  if (act === 'printReport') return window.print();
  if (act === 'copyReport') { try { await navigator.clipboard.writeText(document.getElementById('rp').innerText.replace(/\n{3,}/g, '\n\n')); el.textContent = '복사됨'; } catch {} return; }
  if (act === 'genPrep') return genPrep();
  if (act === 'toRecord') { const s = await DB.get('sessions', S.sessionId); const t = document.getElementById('p_today'); if (t) { s.today = t.value; s.worry = document.getElementById('p_worry').value; await DB.put('sessions', s); } return go('record'); }
  if (act === 'recStart') return recStart();
  if (act === 'sttRestart') { REC.sttStopped = false; REC.fast = 0; REC.slow = 0; sttNote(''); if (REC.on) startSTT(); return; }
  if (act === 'recStop') return recStopUI();
  if (act === 'saveAnalyze') return persistSession(true);
  if (act === 'saveOnly') return persistSession(false);
  if (act === 'analyzeNow') { S.busy = true; S.msg = ''; render(); try { await analyzeSession(); } catch (er) { S.msg = er.message; } S.busy = false; return render(); }
  if (act === 'copyFm') { try { await navigator.clipboard.writeText(document.getElementById('fm').textContent); el.textContent = '복사됨'; } catch {} return; }
  if (act === 'delSession') { if (!confirm('이 상담 기록을 삭제할까요? (녹음 포함)')) return; const s = await DB.get('sessions', id); await DB.del('sessions', id); return go('child', { childId: s.childId }); }
  if (act === 'coachGo') {
    const q = document.getElementById('c_q').value.trim(); if (!q) return;
    const a = document.getElementById('c_a').value.trim();
    S.busy = true; S.msg = ''; S.coachOut = ''; render();
    try { S.coachOut = await callAI(`부모님 질문: ${q}\n${a ? '내가 하려던 답변: ' + a + '\n' : ''}
다음 형식으로 간결하게 답하세요.
1) 이 질문 뒤에 있는 부모의 진짜 걱정 (한 줄)
2) 추천 답변 (구어체, 3~5문장: 공감 → 근거/관찰 → 다음 단계)
3) ${a ? '내 답변 첨삭 (좋은 점 1개, 고칠 점 2개)' : '피해야 할 말 1~2개'}
4) 덧붙이면 좋은 한 문장`, 1200); } catch (er) { S.msg = er.message; }
    S.busy = false; return render();
  }
  if (act === 'export') {
    const d = { version: 1, children: await DB.all('children'), sessions: (await DB.all('sessions')).map(({ audio, ...r }) => r) };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' }));
    a.download = 'parent-coach-backup-' + today() + '.json'; a.click(); return;
  }
});
function f(id) { return document.getElementById(id).value.trim(); }
document.addEventListener('change', (e) => {
  const t = e.target, box = t.closest && t.closest('[data-goal]');
  if (!box || !S.sessionId) return;
  const gid = box.dataset.goal;
  if (t.classList.contains('gl-pct')) { const n = t.value === '' ? null : Math.max(0, Math.min(100, Number(t.value))); updateSession(S.sessionId, (x) => { x.goalLogs = x.goalLogs || {}; x.goalLogs[gid] = { ...(x.goalLogs[gid] || {}), v: n }; }); }
  else if (t.classList.contains('gl-note')) updateSession(S.sessionId, (x) => { x.goalLogs = x.goalLogs || {}; x.goalLogs[gid] = { ...(x.goalLogs[gid] || {}), note: t.value }; });
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
