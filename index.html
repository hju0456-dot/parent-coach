<script>
/* ============ 저장소 (IndexedDB, 이 기기 안에만 저장) ============ */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    if (db) return res(db);
    const r = indexedDB.open('parent-coach', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('children', { keyPath: 'id' });
      d.createObjectStore('sessions', { keyPath: 'id' });
    };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
  const tx = async (store, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    all: (s) => tx(s, 'readonly', (o) => o.getAll()),
    get: (s, id) => tx(s, 'readonly', (o) => o.get(id)),
    put: (s, v) => tx(s, 'readwrite', (o) => o.put(v)),
    del: (s, id) => tx(s, 'readwrite', (o) => o.delete(id)),
  };
})();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = (s) => esc(s).replace(/\n/g, '<br>');
const today = () => new Date().toISOString().slice(0, 10);
const cfg = {
  get key() { try { return localStorage.getItem('pc_key') || ''; } catch { return ''; } },
  set key(v) { try { localStorage.setItem('pc_key', v); } catch {} },
  get model() { try { return localStorage.getItem('pc_model') || 'claude-sonnet-4-5'; } catch { return 'claude-sonnet-4-5'; } },
  set model(v) { try { localStorage.setItem('pc_model', v); } catch {} },
  get center() { try { return localStorage.getItem('pc_center') || ''; } catch { return ''; } },
  set center(v) { try { localStorage.setItem('pc_center', v); } catch {} },
  get therapist() { try { return localStorage.getItem('pc_th') || ''; } catch { return ''; } },
  set therapist(v) { try { localStorage.setItem('pc_th', v); } catch {} },
  get mode() { try { return localStorage.getItem('pc_mode') || 'auto'; } catch { return 'auto'; } },
  set mode(v) { try { localStorage.setItem('pc_mode', v); } catch {} },
  get maskWords() { try { return localStorage.getItem('pc_mask') || ''; } catch { return ''; } },
  set maskWords(v) { try { localStorage.setItem('pc_mask', v); } catch {} },
  get anon() { try { return localStorage.getItem('pc_anon') !== '0'; } catch { return true; } },
  set anon(v) { try { localStorage.setItem('pc_anon', v ? '1' : '0'); } catch {} },
};

/* ============ AI 호출 ============ */
const SYSTEM = `당신은 아동발달센터 작업치료사의 '부모 상담' 코치입니다. 한국 부모를 대상으로 40분 수업 후 10분 상담을 하는 2년차 작업치료사를 돕습니다.
목표: 부모가 치료사에게 신뢰를 느끼고 치료를 지속하도록, 전문성과 따뜻함을 갖춘 상담을 하게 돕는 것.
원칙:
- 결론(아이의 오늘 변화)을 먼저, 근거(관찰한 구체적 장면)를 다음, 가정에서 할 일 1~2개, 다음 목표 순서로 말하기.
- 전문용어는 쉬운 말로 풀어 쓰고, 필요하면 용어를 한 번만 덧붙이기.
- 아이의 강점을 먼저 말하되 과장/허위 약속(완치, 기간 보장)은 하지 않기. 부족한 점은 '다음 목표'로 프레이밍하기.
- 진단이나 의학적 판단을 단정하지 말고 필요 시 의사/타 전문가 연계를 안내.
- 답변은 한국어, 실제로 말할 수 있는 구어체 문장으로.`;

/* ---------- 개인정보 자동 가리기 (밖으로 나가는 글에만 적용, 기기 안 원본은 그대로) ---------- */
const escRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const splitWords = (x) => String(x || '').split(/[,\n，、]/).map((w) => w.trim()).filter(Boolean);
const isKo3 = (n) => /^[가-힣]{3}$/.test(n || '');
function wordRules(ctx) {
  const rules = [];
  const add = (w, r, k) => { if (w && w.length >= 2) rules.push([w, r, k]); };
  ctx.children.forEach((c) => {
    const kid = !ctx.currentId || c.id === ctx.currentId ? '아이' : '다른 아이';
    add(c.name, kid, '아이 이름'); if (isKo3(c.name)) add(c.name.slice(1), kid, '아이 이름');
    splitWords(c.parentNames).forEach((p) => { add(p, '부모님', '보호자 이름'); if (isKo3(p)) add(p.slice(1), '부모님', '보호자 이름'); });
    splitWords(c.maskWords).forEach((w) => add(w, '[가림]', '지정 단어'));
  });
  splitWords(cfg.maskWords).forEach((w) => add(w, '[가림]', '지정 단어'));
  add(cfg.center, '[센터]', '센터명');
  add(cfg.therapist, '[치료사]', '치료사 이름'); if (isKo3(cfg.therapist)) add(cfg.therapist.slice(1), '[치료사]', '치료사 이름');
  return rules.sort((a, b) => b[0].length - a[0].length);
}
const PATTERNS = [
  ['주민번호', /(?<!\d)\d{6}[-\s]?[1-4]\d{6}(?!\d)/g, '[주민번호]'],
  ['전화번호', /(?<!\d)0(?:1[016-9]|2|[3-6][1-5]|70|50\d?)[-.\s]?\d{3,4}[-.\s]?\d{4}(?!\d)/g, '[전화번호]'],
  ['카드번호', /(?<!\d)(?:\d{4}[-\s]?){3}\d{4}(?!\d)/g, '[카드번호]'],
  ['이메일', /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '[이메일]'],
  ['주소', /[가-힣0-9]{2,}(?:아파트|빌라|맨션|오피스텔)(?:\s?\d+동)?(?:\s?\d+호)?/g, '[주소]'],
  ['주소', /[가-힣]{2,}(?<!으)(?:대로|로|길)\s?\d+(?:-\d+)?(?:번길(?:\s?\d+(?:-\d+)?)?)?(?![~\d]|\s?(?:번(?!길)|개|회|분|초|명|살|세|시|달|주|일|년|월|배|점|장|곡|문장|문|줄|가지|cm|mm|kg|%))/g, '[주소]'],
  ['긴 숫자', /(?<!\d)\d[\d-]{8,}\d(?!\d)/g, '[번호]'],
];
function redact(text, ctx) {
  let t = String(text); const found = {}; const bump = (k) => (found[k] = (found[k] || 0) + 1);
  wordRules(ctx).forEach(([w, r, k]) => { const isName = k === '아이 이름' || k === '보호자 이름' || k === '치료사 이름'; t = t.replace(new RegExp(escRe(w) + (isName ? '(?:이(?=[가는를도랑의만에께한]|[\\s.,!?]|$))?' : ''), 'g'), () => { bump(k); return r; }); });
  PATTERNS.forEach(([k, re, r]) => { t = t.replace(re, (m) => { if (k === '긴 숫자' && m.replace(/\D/g, '').length < 10) return m; bump(k); return r; }); });
  return { text: t, found };
}
async function redactText(text) {
  if (!cfg.anon) return { text: String(text), found: {} };
  return redact(text, { children: await DB.all('children'), currentId: S.childId });
}
const foundSummary = (f) => Object.entries(f).map(([k, v]) => k + ' ' + v + '건').join(', ') || '가려진 항목 없음';

/* ---------- 복사·붙여넣기 모드 (API 키 없이 무료 AI 채팅 이용) ---------- */
function pasteFlow(prompt, found) {
  return new Promise((res, rej) => {
    const full = '아래 [역할과 원칙]을 따라 [요청]에 답해 주세요.\n\n[역할과 원칙]\n' + SYSTEM + '\n\n[요청]\n' + prompt;
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="mbox">
      <h3 style="margin:0 0 4px">AI에게 물어보기 (무료 방식)</h3>
      <div class="mute">개인정보는 아래처럼 자동으로 가려졌어요. 그래도 남은 실명이 있으면 글에서 직접 지워 주세요.</div>
      <div id="m_sum" style="margin-top:6px"></div>
      <h4>① 아래 글을 복사해서 AI 채팅창에 붙여넣기</h4>
      <textarea id="m_prompt"></textarea>
      <div class="row" style="margin-top:8px"><button class="b" id="m_copy">복사하기</button>
        <a class="b sec" href="https://claude.ai/new" target="_blank" rel="noopener">Claude 열기</a>
        <a class="b sec" href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT 열기</a>
        <a class="b sec" href="https://gemini.google.com/app" target="_blank" rel="noopener">Gemini 열기</a></div>
      <h4>② AI가 답한 내용을 전부 복사해서 여기에 붙여넣기</h4>
      <textarea id="m_ans" placeholder="AI의 답변 전체를 붙여넣으세요"></textarea>
      <div class="row" style="margin-top:10px"><button class="b" id="m_ok">결과 적용</button><button class="b sec" id="m_no">취소</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector('#m_prompt').value = full;
    m.querySelector('#m_sum').innerHTML = (Object.keys(found).length ? Object.entries(found).map(([k, v]) => `<span class="chip">${esc(k)} ${v}건 가림</span>`).join('') : '<span class="mute">자동으로 가려진 항목이 없어요.</span>');
    const close = () => m.remove();
    m.querySelector('#m_copy').onclick = async (e) => {
      const ta = m.querySelector('#m_prompt');
      try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand('copy'); }
      e.target.textContent = '복사됨 ✓';
    };
    m.querySelector('#m_ok').onclick = () => { const v = m.querySelector('#m_ans').value.trim(); if (!v) return; close(); res(v); };
    m.querySelector('#m_no').onclick = () => { close(); rej(new Error('취소했어요.')); };
  });
}

async function callAI(userText, maxTokens = 2500) {
  const r = await redactText(userText);
  if (cfg.mode === 'paste' || !cfg.key) return pasteFlow(r.text, r.found);
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': cfg.key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({ model: cfg.model, max_tokens: maxTokens, system: SYSTEM, messages: [{ role: 'user', content: r.text }] }),
  });
  const j = await resp.json();
  if (!resp.ok) throw new Error(j.error?.message || 'AI 호출 실패 (' + resp.status + ')');
  return j.content.map((c) => c.text || '').join('');
}
function parseJSON(t) {
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b < 0) throw new Error('AI 응답을 해석하지 못했습니다. 다시 시도해 주세요.');
  return JSON.parse(t.slice(a, b + 1));
}
const anonText = (s, child) => {
  if (!cfg.anon || !child || !child.name) return s;
  return String(s).split(child.name).join('아이');
};
const childCtx = (c) => `[아이 정보] 나이/학년: ${c.age || '미입력'} / 진단·주호소: ${c.dx || '미입력'} / 치료 목표: ${c.goals || '미입력'} / 부모 성향·특이사항: ${c.parentNote || '미입력'} / 등록 후 수업 횟수: ${c.sessionsCount || '미입력'}`;

/* ============ 질문/답변 유형 ============ */
const QTYPES = ['효과·성과 확인', '기간·횟수·종결 시기', '가정 지도 방법', '발달 불안·진단 관련', '행동 문제 대처', '학교·또래 적응', '비용·스케줄', '타 치료·타 기관 비교', '불만·불신 표현', '기타'];
const ATYPES = ['공감형', '근거·관찰 제시형', '구체적 가이드형', '모호·회피형', '전문용어 과다형', '과잉 약속형', '방어·변명형'];

/* ============ 상태/렌더 ============ */
let S = { view: 'home', childId: null, sessionId: null, tab: 'home', busy: false, msg: '', rec: null };
const $app = document.getElementById('app');
const go = (v, extra = {}) => { S = { ...S, view: v, msg: '', ...extra }; render(); window.scrollTo(0, 0); };

function setNav() {
  const tabs = [['home', '아이 목록'], ['stats', '데이터 분석'], ['coach', '즉석 코치'], ['backup', '백업']];
  document.getElementById('nav').innerHTML = tabs.map(([k, n]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${n}</button>`).join('');
}

async function render() {
  setNav();
  const v = S.view;
  try {
    if (v === 'home') return home();
    if (v === 'child') return child();
    if (v === 'childForm') return childForm();
    if (v === 'prep') return prep();
    if (v === 'record') return record();
    if (v === 'review') return review();
    if (v === 'report') return report();
    if (v === 'stats') return stats();
    if (v === 'coach') return coach();
    if (v === 'backup') return backup();
    if (v === 'settings') return settings();
  } catch (e) { $app.innerHTML = `<div class="card">오류: ${esc(e.message)}</div>`; }
}

/* ---------- 홈 ---------- */
async function home() {
  document.getElementById('title').textContent = '부모 상담 도우미';
  const kids = (await DB.all('children')).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  const sess = await DB.all('sessions');

const REC = { stream: null, mr: null, chunks: [], sr: null, on: false, t0: 0, timer: null, finalText: '' };
async function recStart() {
  const ta = document.getElementById('r_text');
  try {
    REC.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { S.msg = '마이크를 사용할 수 없어요. 브라우저의 마이크 권한을 허용해 주세요.'; return render(); }
  REC.chunks = [];
  REC.mr = new MediaRecorder(REC.stream);
  REC.mr.ondataavailable = (e) => e.data.size && REC.chunks.push(e.data);
  REC.mr.start(1000);
  REC.on = true; REC.t0 = Date.now(); REC.finalText = ta.value ? ta.value.trimEnd() + '\n' : '';
  document.getElementById('btnRec').style.display = 'none';
  document.getElementById('btnStop').style.display = '';
  document.getElementById('timer').innerHTML = '<span class="dot"></span><span id="tt">00:00</span>';
  REC.timer = setInterval(() => {
    const sec = Math.floor((Date.now() - REC.t0) / 1000);
    const el = document.getElementById('tt'); if (el) el.textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
  }, 500);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    REC.sr = new SR(); REC.sr.lang = 'ko-KR'; REC.sr.continuous = true; REC.sr.interimResults = true;
    REC.sr.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) REC.finalText += t.trim() + '\n'; else interim += t;
      }
      const el = document.getElementById('r_text'); if (el) el.value = REC.finalText + interim;
    };
    REC.sr.onend = () => { if (REC.on) { try { REC.sr.start(); } catch {} } };
    REC.sr.onerror = () => {};
    try { REC.sr.start(); } catch {}
  }
}
function recStop() {
  return new Promise((res) => {
    REC.on = false; clearInterval(REC.timer);
    try { REC.sr && REC.sr.stop(); } catch {}
    if (!REC.mr || REC.mr.state === 'inactive') return res(null);
    REC.mr.onstop = () => {
      REC.stream.getTracks().forEach((t) => t.stop());
      res(new Blob(REC.chunks, { type: REC.mr.mimeType || 'audio/webm' }));
    };
    REC.mr.stop();
  });
}
let pendingAudio = null;
async function recStopUI() {
  pendingAudio = await recStop();
  const s = await DB.get('sessions', S.sessionId);
  s.transcript = document.getElementById('r_text').value;
  if (pendingAudio) s.audio = pendingAudio;
  await DB.put('sessions', s);
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('btnRec').style.display = '';
  document.getElementById('btnRec').textContent = '● 이어서 녹음';
  document.getElementById('timer').textContent = '녹음 저장됨';
}
async function persistSession(analyze) {
  if (REC.on) await recStopUI();
  const s = await DB.get('sessions', S.sessionId);

  if (!analyze) return go('review');
  if (!s.transcript.trim()) { S.msg = '분석할 대화 내용이 없어요. 내용을 입력하거나 녹음해 주세요.'; return render(); }

/* ---------- 아이별 성장 그래프 ---------- */
function lineChart(pts, max, unit) {
  const W = 600, H = 170, L = 34, R = 12, T = 12, B = 30;
  const x = (i) => L + (pts.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (pts.length - 1));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const grid = [0, 0.5, 1].map((g) => `<line x1="${L}" x2="${W - R}" y1="${y(max * g)}" y2="${y(max * g)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(max * g) + 4}" text-anchor="end">${Math.round(max * g)}</text>`).join('');
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(p.v)).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="var(--pri)"/><text x="${x(i)}" y="${y(p.v) - 8}" text-anchor="middle" style="fill:var(--ink)">${p.v}${unit || ''}</text><text x="${x(i)}" y="${H - 10}" text-anchor="middle">${esc(p.l)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="추이 그래프">${grid}<path d="${path}" fill="none" stroke="var(--pri)" stroke-width="2.5"/>${dots}</svg>`;
}
function growthCard(sess) {
  const a = sess.filter((s) => s.analysis).sort((p, q) => p.date.localeCompare(q.date));
  if (a.length < 2) return `<div class="card"><h3>상담 성장 그래프</h3><div class="mute">AI 분석이 2회 이상 쌓이면 이 아이 상담의 점수 변화가 그래프로 나타나요.</div></div>`;
  const last = a.slice(-8);
  const lab = { empathy: '공감', evidence: '근거 제시', clarity: '쉬운 설명', guidance: '가정 지도', confidence: '자신감·전문성' };
  const first = a[0].analysis.scores || {}, cur = a[a.length - 1].analysis.scores || {};
  const rows = Object.keys(lab).map((k) => { const d = (Number(cur[k]) || 0) - (Number(first[k]) || 0); return `<div class="bar"><div class="n">${lab[k]}</div><div class="t"><i style="width:${(Number(cur[k]) || 0) * 20}%"></i></div><div class="v">${cur[k] ?? '-'}</div><div class="v" style="width:44px;color:${d > 0 ? 'var(--ok)' : d < 0 ? 'var(--warn)' : 'var(--mute)'}">${d > 0 ? '▲' + d : d < 0 ? '▼' + Math.abs(d) : '–'}</div></div>`; }).join('');
  return `<div class="card"><h3>상담 성장 그래프 <span class="mute">(최근 ${last.length}회 신뢰 점수)</span></h3>${lineChart(last.map((s) => ({ l: s.date.slice(5), v: Number(s.analysis.score) || 0 })), 100)}
  <h3 style="margin-top:12px">항목별 최근 점수 <span class="mute">(첫 상담 대비 변화)</span></h3>${rows}</div>`;
}

/* {이름} 치환 + 받침에 맞는 조사 보정 */
function fillName(t, name) {
  const last = name.charCodeAt(name.length - 1), hasB = last >= 0xac00 && last <= 0xd7a3 && (last - 0xac00) % 28 !== 0;
  const map = { '이': ['이', '가'], '가': ['이', '가'], '은': ['은', '는'], '는': ['은', '는'], '을': ['을', '를'], '를': ['을', '를'], '과': ['과', '와'], '와': ['과', '와'] };
  return t.replace(/\{이름\}([이가은는을를과와])?/g, (m, j) => name + (j ? map[j][hasB ? 0 : 1] : ''));
}

async function stats() {
  document.getElementById('title').textContent = '데이터 분석';
  const sess = (await DB.all('sessions')).filter((s) => s.analysis).sort((a, b) => a.date.localeCompare(b.date));

  const qs = sess.flatMap((s) => (s.analysis.qa || []).map((q) => ({ ...q, date: s.date, childId: s.childId })));
  const cntBy = (arr, k) => { const m = {}; arr.forEach((x) => { const v = x[k] || '기타'; m[v] = (m[v] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const bars = (rows, max) => rows.map(([n, v]) => `<div class="bar"><div class="n">${esc(n)}</div><div class="t"><i style="width:${(v / max) * 100}%"></i></div><div class="v">${v}</div></div>`).join('');
  const qt = cntBy(qs, 'qtype'), at = cntBy(qs, 'atype');
  const avg = (a) => (a.length ? (a.reduce((x, y) => x + (Number(y) || 0), 0) / a.length).toFixed(1) : '-');
  // 질문유형별 평균 답변 점수
  const byQ = {}; qs.forEach((q) => { (byQ[q.qtype] = byQ[q.qtype] || []).push(q.rating); });
  const weak = Object.entries(byQ).map(([k, v]) => [k, +avg(v), v.length]).filter((x) => x[2] >= 1).sort((a, b) => a[1] - b[1]);
  // 월별 점수
  const mm = {}; sess.forEach((s) => { const m = s.date.slice(0, 7); (mm[m] = mm[m] || []).push(s.analysis.score); });
  const risky = sess.filter((s) => s.analysis.dropout_risk === '높음').slice(-5).reverse();
  // 대표 질문(낮은 평점)
  const hard = qs.filter((q) => Number(q.rating) <= 3).slice(-6).reverse();
  $app.innerHTML = `
  <div class="card"><div class="row"><div><div class="mute">분석된 상담</div><div class="score">${sess.length}</div></div><div><div class="mute">평균 점수</div><div class="score">${avg(sess.map((s) => s.analysis.score))}</div></div><div><div class="mute">질문 수</div><div class="score">${qs.length}</div></div></div></div>
  <div class="card"><h3>월별 평균 점수</h3>${bars(Object.entries(mm).map(([m, v]) => [m, Math.round(avg(v))]), 100)}</div>
  <div class="card"><h3>부모가 자주 하는 질문 유형</h3>${bars(qt, qt[0]?.[1] || 1)}</div>
  <div class="card"><h3>내 답변 유형</h3>${bars(at, at[0]?.[1] || 1)}<div class="mute">‘모호·회피형’, ‘전문용어 과다형’, ‘과잉 약속형’이 많다면 개선 신호예요.</div></div>
  <div class="card"><h3>질문 유형별 내 답변 평점 (낮은 순)</h3>${weak.map(([k, v, n]) => `<div class="bar"><div class="n">${esc(k)}</div><div class="t"><i style="width:${v * 20}%"></i></div><div class="v">${v}</div></div>`).join('')}</div>
  <div class="card"><h3>다시 연습하면 좋은 질문</h3>${hard.map((q) => `<div class="qa bad"><span class="tag">${esc(q.qtype)}</span><div><b>Q.</b> ${esc(q.q)}</div><div><b>추천:</b> ${esc(q.better)}</div></div>`).join('') || '<div class="mute">낮은 평점의 질문이 없어요.</div>'}</div>
  <div class="card"><h3>이탈 위험 '높음' 최근 상담</h3>${risky.map((s) => `<div class="list-item" data-act="openSession" data-id="${s.id}"><b>${esc(kids[s.childId]?.name || '?')}</b> ${esc(s.date)}<div class="mute">${esc(s.analysis.dropout_reason)}</div></div>`).join('') || '<div class="mute">없음</div>'}</div>`;
}

  if (act === 'newChild') return go('childForm', { childId: null });
  if (act === 'editChild') return go('childForm', { childId: id });
  if (act === 'openChild') return go('child', { childId: id, tab: 'home' });
  if (act === 'saveChild') {
    const name = document.getElementById('f_name').value.trim(); if (!name) return alert('이름을 입력해 주세요.');
    const old = id ? await DB.get('children', id) : {};
    const c = { ...old, id: id || uid(), name, age: f('f_age'), dx: f('f_dx'), goals: f('f_goals'), parentNote: f('f_pn'), parentNames: f('f_pnames'), maskWords: f('f_mask') };
    await DB.put('children', c); return go('child', { childId: c.id });
  }
  if (act === 'delChild') { if (!confirm('이 아이와 모든 상담 기록을 삭제할까요?')) return; for (const s of (await DB.all('sessions')).filter((s) => s.childId === id)) await DB.del('sessions', s.id); await DB.del('children', id); return go('home', { tab: 'home', childId: null }); }
  if (act === 'newSession') { const s = { id: uid(), childId: id, date: today() }; await DB.put('sessions', s); return go('prep', { childId: id, sessionId: s.id }); }
  if (act === 'openSession') { const s = await DB.get('sessions', id); return go('review', { childId: s.childId, sessionId: id }); }
  if (act === 'reprep') { const s = await DB.get('sessions', id); return go('prep', { childId: s.childId, sessionId: id }); }
  if (act === 'reRecord') return go('record');
  if (act === 'openReport') return go('report');
  if (act === 'backReview') return go('review');
  if (act === 'genReport') return genReport();
  if (act === 'printReport') return window.print();
  if (act === 'copyReport') { try { await navigator.clipboard.writeText(document.getElementById('rp').innerText.replace(/\n{3,}/g, '\n\n')); el.textContent = '복사됨'; } catch {} return; }
  if (act === 'genPrep') return genPrep();
  if (act === 'toRecord') { const s = await DB.get('sessions', S.sessionId); const t = document.getElementById('p_today'); if (t) { s.today = t.value; s.worry = document.getElementById('p_worry').value; await DB.put('sessions', s); } return go('record'); }
  if (act === 'recStart') return recStart();
  if (act === 'recStop') return recStopUI();
  if (act === 'saveAnalyze') return persistSession(true);
  if (act === 'saveOnly') return persistSession(false);
  if (act === 'analyzeNow') { S.busy = true; S.msg = ''; render(); try { await analyzeSession(); } catch (er) { S.msg = er.message; } S.busy = false; return render(); }
  if (act === 'copyFm') { try { await navigator.clipboard.writeText(document.getElementById('fm').textContent); el.textContent = '복사됨'; } catch {} return; }
  if (act === 'delSession') { if (!confirm('이 상담 기록을 삭제할까요? (녹음 포함)')) return; const s = await DB.get('sessions', id); await DB.del('sessions', id); return go('child', { childId: s.childId }); }
  if (act === 'coachGo') {
    const q = document.getElementById('c_q').value.trim(); if (!q) return;
    const a = document.getElementById('c_a').value.trim();
    S.busy = true; S.msg = ''; S.coachOut = ''; render();
    try { S.coachOut = await callAI(`부모님 질문: ${q}\n${a ? '내가 하려던 답변: ' + a + '\n' : ''}
다음 형식으로 간결하게 답하세요.
1) 이 질문 뒤에 있는 부모의 진짜 걱정 (한 줄)
2) 추천 답변 (구어체, 3~5문장: 공감 → 근거/관찰 → 다음 단계)
3) ${a ? '내 답변 첨삭 (좋은 점 1개, 고칠 점 2개)' : '피해야 할 말 1~2개'}
4) 덧붙이면 좋은 한 문장`, 1200); } catch (er) { S.msg = er.message; }
    S.busy = false; return render();
  }
  if (act === 'export') {
    const d = { version: 1, children: await DB.all('children'), sessions: (await DB.all('sessions')).map(({ audio, ...r }) => r) };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], { type: 'application/json' }));
    a.download = 'parent-coach-backup-' + today() + '.json'; a.click(); return;
  }
});
function f(id) { return document.getElementById(id).value.trim(); }

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
